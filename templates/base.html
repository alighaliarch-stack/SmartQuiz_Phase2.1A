<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <!-- Bootstrap 5 (CDN — see note at bottom of file about self-hosting later) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      /* ---- SmartQuiz brand palette, sampled from the logo ---- */
      /* Primary: the logo's orange (top of the Q-ring, "Create") */
      --sq-primary: #F5820A;
      --sq-primary-hi: #FFA733;
      /* Secondary / success: the logo's "king green" (checkmark, "Engage"/"Learn") */
      --sq-mint: #3FA34D;
      --sq-mint-hi: #4CC15D;
      /* Accent / danger / live: the logo's red (bottom of the Q-ring, "Quiz") */
      --sq-rose: #E5342A;
      --sq-rose-hi: #FF6B5C;
      /* Warning: a distinct warm amber, kept apart from --sq-primary so the
         two don't get confused as the same signal */
      --sq-amber: #FFB020;
      /* Explicit semantic aliases (Part 1's "Success/warning/error states") */
      --sq-success: var(--sq-mint);
      --sq-warning: var(--sq-amber);
      --sq-danger: var(--sq-rose);
      /* Dark "ink" text — echoes the logo's own dark navy "Smart" wordmark;
         used as the label color on solid brand-colored fills (buttons,
         icon badges), since white-on-orange/green/red doesn't reach
         comfortable contrast but this dark navy does across all three. */
      --sq-ink: #1A130E;

      /* ---- neutral surfaces: warm dark, not the old cool violet ---- */
      --sq-bg-start: #16130F;
      --sq-bg-end: #241C15;
      --sq-text: #F3F0EC;
      --sq-text-dim: rgba(243, 240, 236, 0.72);
      --sq-glass: rgba(255, 255, 255, 0.07);
      --sq-glass-border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: linear-gradient(160deg, var(--sq-bg-start), var(--sq-bg-end));
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--sq-text);
      background:
        radial-gradient(1100px 550px at 8% -8%, rgba(245, 130, 10, 0.30), transparent 60%),
        radial-gradient(900px 480px at 105% 12%, rgba(63, 163, 77, 0.20), transparent 55%),
        linear-gradient(160deg, var(--sq-bg-start), var(--sq-bg-end));
      /* NOTE: intentionally NOT background-attachment: fixed — on a page
         shorter than the viewport (e.g. the student join form), a fixed
         background only paints within the viewport and leaves the extra
         document height below it showing html's plain background. Since
         html now carries the same gradient as a fallback, this is belt-
         and-suspenders safe either way, but keeping attachment normal
         (scrolling with content) is the simplest fix with no visual
         downside for this app. */
    }

    h1, h2, h3, .navbar-brand {
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    p.lead-sub { color: var(--sq-text-dim); }

    /* ---------------------------------------------------------- navbar */

    .sq-navbar {
      background: rgba(20, 17, 48, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--sq-glass-border);
    }

    .sq-navbar .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sq-text);
      font-size: 1.15rem;
    }

    .sq-navbar .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--sq-primary-hi), var(--sq-mint));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--sq-ink);
    }

    .sq-navbar .nav-link {
      color: var(--sq-text-dim) !important;
      font-weight: 600;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    .sq-navbar .nav-link:hover,
    .sq-navbar .nav-link.active { color: var(--sq-text) !important; }

    /* ------------------------------------------------------------ hero */

    .sq-hero {
      padding: 7.5rem 0 5rem;
      text-align: center;
    }

    .sq-hero.sq-hero-compact { padding: 8.5rem 0 4rem; }

    .sq-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--sq-glass);
      border: 1px solid var(--sq-glass-border);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--sq-mint);
    }

    .sq-hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      margin: 1.25rem 0 0.75rem;
    }

    .sq-hero .lead-sub {
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      max-width: 620px;
      margin: 0 auto 2.25rem;
    }

    /* rounded pill buttons */
    .btn-sq {
      border-radius: 999px;
      padding: 0.85rem 2rem;
      font-weight: 700;
      border: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-sq:active { transform: scale(0.97); }

    .btn-sq-primary {
      background: linear-gradient(135deg, var(--sq-primary-hi), var(--sq-primary));
      color: var(--sq-ink);
      box-shadow: 0 10px 28px rgba(245, 130, 10, 0.4);
    }
    .btn-sq-primary:hover {
      color: var(--sq-ink);
      box-shadow: 0 12px 34px rgba(245, 130, 10, 0.55);
      transform: translateY(-2px);
    }

    .btn-sq-outline {
      background: var(--sq-glass);
      border: 1.5px solid var(--sq-glass-border);
      color: var(--sq-text);
    }
    .btn-sq-outline:hover {
      color: #fff;
      border-color: var(--sq-mint);
      transform: translateY(-2px);
    }

    /* --------------------------------------------------------- glass cards */

    .sq-card {
      background: var(--sq-glass);
      border: 1px solid var(--sq-glass-border);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2rem 1.75rem;
      height: 100%;
      transition: transform .2s ease, border-color .2s ease;
    }
    .sq-card:hover {
      transform: translateY(-6px);
      border-color: rgba(245, 130, 10, 0.45);
    }
    .sq-card .icon-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--sq-primary-hi), var(--sq-mint));
      color: var(--sq-ink);
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .sq-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .sq-card p { color: var(--sq-text-dim); margin: 0; font-size: 0.94rem; }

    /* placeholder "coming soon" panel used by /admin and /join for now */
    .sq-placeholder-panel {
      max-width: 520px;
      margin: 0 auto;
      padding: 2.75rem 2rem;
      text-align: center;
    }
    .sq-placeholder-panel .icon-badge {
      width: 64px;
      height: 64px;
      font-size: 1.6rem;
      margin: 0 auto 1.25rem;
    }

    /* ------------------------------------------------------------ footer */

    .sq-footer {
      border-top: 1px solid var(--sq-glass-border);
      padding: 2.5rem 0;
      margin-top: 4rem;
      color: var(--sq-text-dim);
      font-size: 0.9rem;
    }
    .sq-footer a {
      color: var(--sq-text-dim);
      text-decoration: none;
      margin-left: 1.25rem;
    }
    .sq-footer a:hover { color: var(--sq-text); }

    /* --------------------------------------------------------- animation */

    @keyframes sqFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .sq-animate {
      animation: sqFadeUp 0.7s ease both;
    }
    .sq-animate.delay-1 { animation-delay: 0.08s; }
    .sq-animate.delay-2 { animation-delay: 0.16s; }
    .sq-animate.delay-3 { animation-delay: 0.24s; }

    @media (prefers-reduced-motion: reduce) {
      .sq-animate { animation: none; }
      .sq-card, .btn-sq { transition: none; }
    }

    /* --------------------------------------------------- waiting indicator */

    .stat-card { padding: 1.4rem 1.5rem; }
    .stat-card .icon-badge {
      width: 42px; height: 42px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--sq-primary-hi), var(--sq-mint));
      color: var(--sq-ink); font-size: 1.05rem; margin-bottom: 0.9rem;
    }
    .stat-card .val { font-size: 1.9rem; font-weight: 800; line-height: 1; color: var(--sq-text); }
    .stat-card .lbl { font-size: 0.8rem; color: var(--sq-text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: 6px; }
    .sq-note { font-size: 0.85rem; color: var(--sq-text-dim); }

    .waiting-orb {
      width: 120px;
      height: 120px;
      margin: 6px auto 20px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(245,130,10,0.20), transparent 70%);
    }
    .waiting-orb::before, .waiting-orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--sq-primary-hi);
      animation: sqRingPulse 2.2s ease-out infinite;
    }
    .waiting-orb::after { animation-delay: 1.1s; }
    .waiting-orb .emoji { font-size: 40px; z-index: 1; }

    @keyframes sqRingPulse {
      0% { transform: scale(0.75); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .waiting-orb::before, .waiting-orb::after { animation: none; opacity: 0.35; }
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

  <!-- ============================== NAVBAR ============================== -->
  <nav class="navbar navbar-expand-lg sq-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">
        <span class="brand-mark">Q</span>
        {{ app_name }}
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sqNav"
              aria-controls="sqNav" aria-expanded="false" aria-label="Toggle navigation"
              style="border-color: var(--sq-glass-border);">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="sqNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item"><a class="nav-link {% if active_page in ['join', 'student'] %}active{% endif %}" href="/join">Join Quiz</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <a class="btn btn-sq btn-sq-primary btn-sm px-4 {% if active_page == 'admin' %}active{% endif %}" href="/admin">Teacher Dashboard</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- =============================== FOOTER =============================== -->
  <footer class="sq-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <div>&copy; 2026 {{ app_name }}. All rights reserved.</div>
      <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_script %}{% endblock %}
</body>
</html>

<!--
  NOTE for the next increment:
  Bootstrap and Bootstrap Icons are loaded from a CDN above, which requires
  internet access. If SmartQuiz needs to run fully offline on classroom
  Wi-Fi (as described earlier in this project), a later step should
  self-host these files under a /static directory and add a
  StaticFiles mount in app.py — intentionally not done here since
  backend files were off-limits for that task.
-->
