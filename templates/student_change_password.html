{% extends "base.html" %}
{% block title %}Change Password · {{ app_name }}{% endblock %}

{% block content %}
<header class="sq-hero sq-hero-compact container">
  <div class="sq-card sq-placeholder-panel sq-animate">
    <h1>Change Your Password</h1>
    <p class="lead-sub">Set a new password before using your student account.</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/student/change-password" class="text-start">
      <div class="mb-3">
        <label for="new-password" class="form-label">New password</label>
        <input id="new-password" name="new_password" type="password" class="form-control"
               autocomplete="new-password" minlength="12" required>
        <div class="form-text">Use at least 12 characters.</div>
      </div>
      <div class="mb-4">
        <label for="confirm-password" class="form-label">Confirm new password</label>
        <input id="confirm-password" name="confirm_password" type="password" class="form-control"
               autocomplete="new-password" minlength="12" required>
      </div>
      <button type="submit" class="btn btn-sq btn-sq-primary w-100">Save Password</button>
    </form>
  </div>
</header>
{% endblock %}
